<!doctype html>
<html lang="ka">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b10">
<title>Carlos Chat — Social</title>
<style>
:root{--bg:#09090d;--panel:#111117;--panel2:#17171f;--line:#252531;--text:#f5f5f7;--muted:#92929f;--accent:#a855f7;--accent2:#ec4899;--good:#22c55e;--danger:#ef4444;--shadow:0 18px 60px #0008}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif}button,input,textarea{font:inherit}button{cursor:pointer;border:0;color:inherit}.hidden{display:none!important}
body{min-height:100vh}.app{min-height:100vh}.top{height:76px;display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:#09090df2;backdrop-filter:blur(20px);z-index:20}.brand{font-weight:900;font-size:30px;letter-spacing:-1.8px;background:linear-gradient(90deg,#8b5cf6,#ec4899);-webkit-background-clip:text;color:transparent}.top-actions{display:flex;gap:10px}.iconbtn{width:46px;height:46px;border-radius:50%;background:var(--panel2);display:grid;place-items:center}.iconbtn svg{width:22px;height:22px}
.layout{max-width:1150px;margin:auto;display:grid;grid-template-columns:220px minmax(0,650px) 250px;gap:22px;padding:22px 18px 95px}.side{position:sticky;top:98px;height:max-content}.nav{display:grid;gap:8px}.nav button{background:transparent;text-align:left;padding:13px 14px;border-radius:15px;color:var(--muted);display:flex;align-items:center;gap:12px}.nav button.active,.nav button:hover{background:var(--panel2);color:#fff}.nav svg{width:21px;height:21px}.profile-mini{margin-top:18px;padding:14px;background:var(--panel);border:1px solid var(--line);border-radius:18px;display:flex;gap:10px;align-items:center}.avatar{width:42px;height:42px;border-radius:50%;object-fit:cover;background:linear-gradient(135deg,#8b5cf6,#ec4899);display:grid;place-items:center;font-weight:800}.avatar.big{width:86px;height:86px;font-size:26px}.mini-name{font-weight:700}.muted{color:var(--muted);font-size:13px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:20px;overflow:hidden;margin-bottom:16px}.card-pad{padding:16px}.composer{display:flex;gap:12px}.composer textarea{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:16px;color:#fff;resize:none;padding:13px;min-height:48px;outline:none}.composer textarea:focus{border-color:#6d28d9}.primary{background:linear-gradient(90deg,#8b5cf6,#ec4899);padding:10px 17px;border-radius:13px;font-weight:800}.secondary{background:var(--panel2);padding:10px 14px;border-radius:13px}.row{display:flex;align-items:center;gap:10px}.between{justify-content:space-between}.post-head{display:flex;gap:11px;align-items:center}.post-name{font-weight:800}.badge{display:inline-flex;align-items:center;justify-content:center;width:17px;height:17px;border-radius:50%;background:#38bdf8;color:white;font-size:10px;font-weight:900;margin-left:4px}.post-media{width:100%;max-height:620px;object-fit:cover;background:#050507}.post-text{font-size:15px;line-height:1.55;white-space:pre-wrap}.actions{display:flex;gap:4px;margin-top:8px}.act{background:transparent;padding:9px;border-radius:11px;color:var(--muted);display:flex;align-items:center;gap:6px}.act:hover{background:var(--panel2);color:#fff}.act.liked{color:#fb7185}.act.saved{color:#fbbf24}.act svg{width:20px;height:20px}.section-title{font-size:21px;font-weight:900;margin:4px 0 14px}.people{display:grid;gap:9px}.person{display:flex;align-items:center;gap:10px;padding:10px;border:1px solid var(--line);background:var(--panel);border-radius:16px}.person-info{flex:1}.online{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 12px #22c55e}.stories{display:flex;gap:12px;overflow:auto;padding-bottom:5px}.story{min-width:76px;text-align:center}.story-ring{width:64px;height:64px;border-radius:50%;padding:2px;background:linear-gradient(135deg,#f59e0b,#ec4899,#8b5cf6);margin:auto}.story-ring img{width:100%;height:100%;object-fit:cover;border-radius:50%;border:3px solid var(--panel)}.story span{display:block;font-size:11px;color:var(--muted);margin-top:5px;overflow:hidden;text-overflow:ellipsis}
.bottom{display:none}.screen{min-width:0}.right-card{padding:15px}.search{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px 12px;gap:8px}.search input{border:0;background:transparent;color:white;outline:0;width:100%}
.chat-overlay{position:fixed;inset:0;background:#050508;z-index:60;display:flex;flex-direction:column}.chat-top{height:72px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:10px 14px;gap:10px}.chat-title{flex:1}.chat-title b{display:block}.chat-title span{font-size:12px;color:var(--muted)}.chat-messages{flex:1;overflow:auto;padding:18px 16px;display:flex;flex-direction:column;gap:8px}.bubble{max-width:78%;padding:10px 13px;border-radius:18px;background:var(--panel2);align-self:flex-start;line-height:1.4;position:relative}.bubble.mine{align-self:flex-end;background:linear-gradient(135deg,#7c3aed,#db2777)}.bubble small{display:block;opacity:.55;font-size:10px;margin-top:4px}.bubble img,.bubble video{max-width:100%;border-radius:12px;display:block}.chat-compose{border-top:1px solid var(--line);padding:10px;display:flex;gap:7px;align-items:end;background:#0b0b10}.chat-compose textarea{flex:1;max-height:120px;min-height:42px;border:1px solid var(--line);background:var(--panel2);color:#fff;border-radius:17px;padding:11px;outline:0;resize:none}.typing{height:18px;padding:0 18px;color:var(--muted);font-size:12px}.auth{min-height:100vh;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 0,#5b21b633,transparent 40%)}.auth-box{width:min(420px,100%);background:var(--panel);border:1px solid var(--line);border-radius:24px;padding:25px;box-shadow:var(--shadow)}.auth-box h1{margin:0 0 6px;font-size:32px}.auth-box p{color:var(--muted)}.field{margin:10px 0}.field input{width:100%;padding:13px;border-radius:13px;border:1px solid var(--line);background:var(--panel2);color:white;outline:0}.tabs{display:flex;background:var(--panel2);border-radius:14px;padding:4px;margin-bottom:16px}.tabs button{flex:1;padding:10px;border-radius:11px;background:transparent;color:var(--muted)}.tabs button.active{background:var(--panel);color:#fff}.notice{padding:11px;border-radius:12px;background:#3b0764;color:#ddd;margin:10px 0;font-size:13px}.modal{position:fixed;inset:0;background:#000a;z-index:80;display:grid;place-items:center;padding:18px}.modal-box{width:min(520px,100%);max-height:90vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:18px}.close{background:var(--panel2);width:38px;height:38px;border-radius:50%}.toast{position:fixed;bottom:92px;left:50%;transform:translateX(-50%);background:#fff;color:#111;padding:11px 16px;border-radius:14px;z-index:100;box-shadow:var(--shadow)}
@media(max-width:900px){.layout{grid-template-columns:1fr;max-width:700px}.side.left,.side.right{display:none}.bottom{position:fixed;bottom:0;left:0;right:0;height:70px;background:#0d0d12f5;border-top:1px solid var(--line);display:flex;z-index:30;justify-content:space-around;padding-bottom:env(safe-area-inset-bottom)}.bottom button{background:transparent;color:var(--muted);display:grid;place-items:center;font-size:10px;gap:3px}.bottom svg{width:22px}.top{height:70px}.layout{padding-top:16px}.chat-overlay{padding-bottom:env(safe-area-inset-bottom)}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://lbsquyhrroayndxlsxwh.supabase.co";
const SUPABASE_KEY="sb_publishable_WeZBHEpsMV3ms4Ls_J0xzA_OJKPW60Z";
const {createClient}=window.supabase;
const sb=createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});
const OWNER_ID="CARLOS-OWNER-7X9K2M4P";
const state={session:null,profile:null,screen:"home",users:[],posts:[],notifications:[],saved:new Set(),openChat:null,chatUser:null,messages:[],typing:false,loading:false,postFile:null};
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=t=>{const d=new Date(t);return d.toLocaleString("ka-GE",{month:"short",day:"numeric",hour:"2-digit",minute:"2-digit"})};
const initials=n=>String(n||"?").trim().split(/\s+/).map(x=>x[0]).join("").slice(0,2).toUpperCase();
const icon=(name)=>({home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>',bell:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></svg>',chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 11.5a8 8 0 0 1-8 8 9 9 0 0 1-4-.9L3 20l1.5-4A8 8 0 1 1 20 11.5z"/></svg>',user:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',heart:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.8 8.7c0 5.5-8.8 10.2-8.8 10.2S3.2 14.2 3.2 8.7A4.7 4.7 0 0 1 12 6a4.7 4.7 0 0 1 8.8 2.7z"/></svg>',bookmark:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 4a2 2 0 0 1 2-2h8a2 2 0 0 1 2 2v18l-6-4-6 4z"/></svg>',send:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m22 2-7 20-4-9-9-4zM22 2 11 13"/></svg>',back:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg>'}[name]||"");
function avatar(p,big=false){return `<div class="avatar ${big?'big':''}">${p?.avatar_url?`<img src="${esc(p.avatar_url)}" style="width:100%;height:100%;border-radius:50%;object-fit:cover">`:initials(p?.name||p?.username)}</div>`}
function verified(p){return p?.verified?'<span class="badge">✓</span>':''}
function navButton(screen,label,ic){return `<button class="${state.screen===screen?'active':''}" onclick="go('${screen}')">${icon(ic)}<span>${label}</span></button>`}
async function getProfile(id=state.session?.user?.id){if(!id)return null;let {data}=await sb.from("profiles").select("*").eq("id",id).maybeSingle();return data}
async function ensureProfile(){if(!state.session)return;state.profile=await getProfile();if(!state.profile){const u=state.session.user;const base=(u.user_metadata?.username||u.email?.split("@")[0]||"user").replace(/[^a-zA-Z0-9_]/g,"").slice(0,24)||"user";let username=base;let i=1;while((await sb.from("profiles").select("id").eq("username",username).maybeSingle()).data){username=base+i++}const {data,error}=await sb.from("profiles").insert({id:u.id,username,name:u.user_metadata?.name||username,bio:"",verified:false}).select().single();if(error){toast(error.message);return}state.profile=data}}
async function loadUsers(){const {data,error}=await sb.from("profiles").select("*").order("created_at",{ascending:false}).limit(100);if(!error)state.users=data||[]}
async function loadPosts(){const {data,error}=await sb.from("posts").select("*, profiles(*)").order("created_at",{ascending:false}).limit(50);if(!error)state.posts=data||[]}
async function loadNotifications(){const {data}=await sb.from("notifications").select("*").eq("user_id",state.session.user.id).order("created_at",{ascending:false}).limit(50);state.notifications=data||[]}
async function loadSaved(){const {data}=await sb.from("saved_posts").select("post_id").eq("user_id",state.session.user.id);state.saved=new Set((data||[]).map(x=>x.post_id))}
async function boot(){const {data}=await sb.auth.getSession();state.session=data.session;if(state.session){await ensureProfile();await Promise.all([loadUsers(),loadPosts(),loadNotifications(),loadSaved()]);subscribe();render()}else renderAuth()}
sb.auth.onAuthStateChange(async(_,session)=>{state.session=session;if(session){setTimeout(async()=>{await ensureProfile();await Promise.all([loadUsers(),loadPosts(),loadNotifications(),loadSaved()]);subscribe();render()},0)}else{state.profile=null;renderAuth()}});
let channels=[];
function subscribe(){channels.forEach(c=>sb.removeChannel(c));channels=[];
const tables=["posts","post_reactions","comments","saved_posts","notifications","messages","message_reactions","story_reactions","reposts","comment_reactions"];
tables.forEach(table=>{const c=sb.channel("carlos-"+table).on("postgres_changes",{event:"*",schema:"public",table},async payload=>{if(table==="posts"||table==="post_reactions"||table==="comments"){await loadPosts()}if(table==="notifications")await loadNotifications();if(table==="saved_posts")await loadSaved();if(table==="messages"&&state.openChat){await loadChatMessages(state.openChat);refreshChatOnly();}if(table!=="messages")render();}).subscribe();channels.push(c)});
}
function renderAuth(){ $("root").innerHTML=`<main class="auth"><section class="auth-box"><div class="brand">CARLOS</div><h1>შედი ან დარეგისტრირდი</h1><p>რეალური ონლაინ სოციალური ჩატი — Supabase-ზე.</p><div class="tabs"><button id="loginTab" class="active" onclick="authMode('login')">შესვლა</button><button id="regTab" onclick="authMode('register')">რეგისტრაცია</button></div><div id="authForm"></div></section></main>`;authMode("login")}
function authMode(mode){$("loginTab").classList.toggle("active",mode==="login");$("regTab").classList.toggle("active",mode==="register");$("authForm").innerHTML=mode==="login"?`<div class="field"><input id="email" type="email" placeholder="Email"></div><div class="field"><input id="password" type="password" placeholder="Password"></div><button class="primary" style="width:100%" onclick="login()">შესვლა</button>`:`<div class="field"><input id="name" placeholder="სახელი"></div><div class="field"><input id="username" placeholder="Username"></div><div class="field"><input id="email" type="email" placeholder="Email"></div><div class="field"><input id="password" type="password" placeholder="Password"></div><button class="primary" style="width:100%" onclick="register()">ანგარიშის შექმნა</button>`}
async function login(){const {error}=await sb.auth.signInWithPassword({email:$("email").value,password:$("password").value});if(error)toast(error.message)}
async function register(){const email=$("email").value,password=$("password").value,name=$("name").value.trim(),username=$("username").value.trim();if(!name||!username||!email||password.length<6)return toast("შეავსე ყველა ველი; პაროლი მინიმუმ 6 სიმბოლო.");const {data,error}=await sb.auth.signUp({email,password,options:{data:{name,username}}});if(error)return toast(error.message);if(!data.session)toast("შეამოწმე Email და დაადასტურე ანგარიში.")}
async function logout(){await sb.auth.signOut()}
function go(s){state.screen=s;render()}
function render(){if(!state.session)return renderAuth();const unread=state.notifications.filter(n=>!n.read).length;$("root").innerHTML=`<div class="app"><header class="top"><div class="brand">CARLOS</div><div class="top-actions"><button class="iconbtn" onclick="go('search')">${icon('search')}</button><button class="iconbtn" onclick="go('notifications')">${icon('bell')} ${unread?`<sup style="color:#f472b6">${unread}</sup>`:""}</button><button class="iconbtn" onclick="openMessages()">${icon('chat')}</button></div></header><div class="layout"><aside class="side left"><nav class="nav">${navButton("home","მთავარი","home")}${navButton("search","ძიება","search")}${navButton("notifications","ნოტიფიკაციები","bell")}${navButton("profile","პროფილი","user")}</nav><div class="profile-mini">${avatar(state.profile)}<div><div class="mini-name">${esc(state.profile?.name)}${verified(state.profile)}</div><div class="muted">@${esc(state.profile?.username)}</div></div></div><button class="secondary" style="width:100%;margin-top:10px" onclick="logout()">გასვლა</button></aside><main class="screen">${screenHTML()}</main><aside class="side right"><div class="card right-card"><div class="section-title">მომხმარებლები</div><div class="people">${state.users.filter(u=>u.id!==state.session.user.id).slice(0,8).map(userCard).join("")||'<div class="muted">ჯერ არავინ არის.</div>'}</div></div></aside></div><nav class="bottom">${navButton("home","Home","home")}${navButton("search","Search","search")}<button onclick="createPost()">＋<span>Create</span></button><button onclick="openMessages()">${icon("chat")}<span>Messages</span></button>${navButton("profile","Profile","user")}</nav></div>${state.openChat?chatHTML():""}`}
function screenHTML(){if(state.screen==="search")return `<div class="section-title">მომხმარებლების ძიება</div><div class="search"><span>${icon("search")}</span><input placeholder="მოძებნე username ან სახელი..." oninput="filterPeople(this.value)"></div><div id="peopleList" class="people" style="margin-top:14px">${state.users.map(userCard).join("")}</div>`;if(state.screen==="notifications")return `<div class="section-title">ნოტიფიკაციები</div><div class="card card-pad">${state.notifications.map(n=>`<div class="row" style="padding:10px 0;border-bottom:1px solid var(--line);opacity:${n.read?.5:1}"><div style="flex:1">${esc(n.text||n.type)}</div><small class="muted">${fmt(n.created_at)}</small></div>`).join("")||'<div class="muted">ნოტიფიკაცია არ არის.</div>'}</div>`;if(state.screen==="profile")return `<div class="card card-pad" style="text-align:center">${avatar(state.profile,true)}<h2>${esc(state.profile.name)}${verified(state.profile)}</h2><div class="muted">@${esc(state.profile.username)}</div><p>${esc(state.profile.bio||"")}</p><button class="secondary" onclick="editProfile()">პროფილის რედაქტირება</button></div>`;return `<div class="card card-pad"><div class="composer">${avatar(state.profile)}<textarea id="postText" placeholder="რა ხდება?"></textarea><label class="secondary" title="მედია">＋<input id="postMedia" type="file" accept="image/*,video/*" hidden onchange="setPostMedia(this.files[0])"></label><button class="primary" onclick="createPost()">Post</button></div></div><div class="card card-pad"><div class="row between"><div class="section-title">Stories</div><label class="secondary">＋ Story<input type="file" accept="image/*,video/*" hidden onchange="createStory(this.files[0])"></label></div><div class="stories">${state.users.slice(0,10).map(p=>`<div class="story"><div class="story-ring">${avatar(p)}</div><span>${esc(p.name||p.username)}</span></div>`).join("")}</div></div>${state.posts.map(postHTML).join("")||'<div class="muted" style="text-align:center;padding:30px">პირველი პოსტი შენ დადე ✨</div>'}`}
function userCard(p){return `<div class="person">${avatar(p)}<div class="person-info"><div class="post-name">${esc(p.name||p.username)}${verified(p)}</div><div class="muted">@${esc(p.username)}</div></div>${p.id!==state.session.user.id?`<button class="primary" onclick="openChatWith('${p.id}')">მიწერა</button>`:""}</div>`}
async function uploadMedia(file,folder="media"){if(!file)throw new Error("ფაილი არ არის არჩეული");const ext=(file.name.split(".").pop()||"bin").replace(/[^a-z0-9]/gi,"").toLowerCase()||"bin";const path=`${state.session.user.id}/${folder}/${Date.now()}-${crypto.randomUUID()}.${ext}`;const {error}=await sb.storage.from("carlos-media").upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});if(error)throw error;const {data}=sb.storage.from("carlos-media").getPublicUrl(path);if(!data?.publicUrl)throw new Error("მედიის URL ვერ შეიქმნა");return data.publicUrl}
async function setPostMedia(file){state.postFile=file||null;toast(file?`არჩეულია: ${file.name}`:"მედია მოიხსნა")}
async function createPost(){const text=$("postText")?.value?.trim();if(!text&&!state.postFile)return toast("დაწერე რამე ან აირჩიე მედია.");try{let media_url=null,media_type=null;if(state.postFile){toast("მედია იტვირთება…");media_url=await uploadMedia(state.postFile,"posts");media_type=state.postFile.type}const {error}=await sb.from("posts").insert({user_id:state.session.user.id,text:text||"",media_url,media_type});if(error)throw error;state.postFile=null;if($("postText"))$("postText").value="";await loadPosts();render();toast("პოსტი გამოქვეყნდა ✓")}catch(e){toast(e.message||"პოსტის შექმნა ვერ მოხერხდა")}}
async function createStory(file){if(!file)return;try{const url=await uploadMedia(file,"stories");const {error}=await sb.from("stories").insert({user_id:state.session.user.id,media_url:url,media_type:file.type||"image"});if(error)throw error;toast("Story გამოქვეყნდა ✓")}catch(e){toast(e.message||"Story ვერ აიტვირთა")}}
function postHTML(p){const profile=p.profiles||state.users.find(u=>u.id===p.user_id)||{};return `<article class="card" data-post="${p.id}"><div class="card-pad"><div class="post-head">${avatar(profile)}<div style="flex:1"><div class="post-name">${esc(profile.name||profile.username)}${verified(profile)}</div><div class="muted">@${esc(profile.username||"user")} · ${fmt(p.created_at)}</div></div></div><div class="post-text" style="margin-top:12px">${esc(p.text)}</div></div>${p.media_url?(p.media_type?.startsWith("video")?`<video class="post-media" controls src="${esc(p.media_url)}"></video>`:`<img class="post-media" src="${esc(p.media_url)}">`):""}<div class="card-pad"><div class="actions"><button class="act" onclick="reactPost('${p.id}','❤️')">${icon("heart")} <span>Like</span></button><button class="act" onclick="reactPost('${p.id}','🔥')">🔥</button><button class="act" onclick="commentPost('${p.id}')">💬</button><button class="act ${state.saved.has(p.id)?"saved":""}" onclick="toggleSave('${p.id}')">${icon("bookmark")}</button></div></div></article>`}
async function reactPost(post_id,reaction){const {error}=await sb.from("post_reactions").upsert({post_id,user_id:state.session.user.id,reaction},{onConflict:"post_id,user_id"});if(error)return toast(error.message);await notifyPostOwner(post_id,"post reaction",`@${state.profile.username}-მ პოსტზე რეაქცია დატოვა ${reaction}`);toast("რეაქცია დაემატა")}
async function toggleSave(post_id){if(state.saved.has(post_id)){const {error}=await sb.from("saved_posts").delete().eq("post_id",post_id).eq("user_id",state.session.user.id);if(error)return toast(error.message)}else{const {error}=await sb.from("saved_posts").insert({post_id,user_id:state.session.user.id});if(error)return toast(error.message)}await loadSaved();render()}
async function commentPost(post_id){const text=prompt("კომენტარი:");if(!text)return;const {error}=await sb.from("comments").insert({post_id,user_id:state.session.user.id,text});if(error)return toast(error.message);await notifyPostOwner(post_id,"comment",`@${state.profile.username}-მ კომენტარი დატოვა`);toast("კომენტარი დაემატა")}
async function notifyPostOwner(post_id,type,text){const p=state.posts.find(x=>x.id===post_id);if(!p||p.user_id===state.session.user.id)return;await sb.from("notifications").insert({user_id:p.user_id,from_user_id:state.session.user.id,type,reference_id:post_id,text})}
function filterPeople(q){q=q.toLowerCase();$("peopleList").innerHTML=state.users.filter(p=>(p.name+" "+p.username).toLowerCase().includes(q)).map(userCard).join("")}
async function editProfile(){const name=prompt("სახელი:",state.profile.name);if(name===null)return;const bio=prompt("Bio:",state.profile.bio||"");if(bio===null)return;const {error}=await sb.from("profiles").update({name,bio}).eq("id",state.session.user.id);if(error)return toast(error.message);await ensureProfile();render()}
async function openMessages(){go("home");const other=state.users.find(u=>u.id!==state.session.user.id);if(other)openChatWith(other.id);else toast("ჯერ სხვა მომხმარებელი არ დარეგისტრირებულა.")}
async function openChatWith(userId){const u=state.users.find(x=>x.id===userId);if(!u)return;state.chatUser=u;state.openChat=await findOrCreateChat(u.id);await loadChatMessages(state.openChat);subscribeChatChannel();render()}
async function findOrCreateChat(otherId){const me=state.session.user.id;const {data:mine}=await sb.from("chat_members").select("chat_id").eq("user_id",me);for(const row of mine||[]){const {data:both}=await sb.from("chat_members").select("user_id").eq("chat_id",row.chat_id);if((both||[]).some(x=>x.user_id===otherId))return row.chat_id}const {data:chat,error}=await sb.from("chats").insert({}).select().single();if(error){toast(error.message);return null}await sb.from("chat_members").insert({chat_id:chat.id,user_id:me});const add=await sb.from("chat_members").insert({chat_id:chat.id,user_id:otherId});if(add.error){toast(add.error.message);return null}return chat.id}
async function loadChatMessages(chatId){if(!chatId)return;const {data,error}=await sb.from("messages").select("*").eq("chat_id",chatId).order("created_at",{ascending:true}).limit(300);if(error)return toast(error.message);state.messages=data||[]}
function chatHTML(){const u=state.chatUser;return `<section class="chat-overlay"><header class="chat-top"><button class="iconbtn" onclick="closeChat()">${icon("back")}</button>${avatar(u)}<div class="chat-title"><b>${esc(u?.name||u?.username)}${verified(u)}</b><span id="chatOnline">online</span></div><button class="iconbtn" onclick="toast('Chat settings')">⋯</button></header><div class="chat-messages" id="chatMessages">${state.messages.map(messageHTML).join("")}</div><div class="typing" id="typingText">${state.typing?esc(u?.name)+" წერს...":""}</div><footer class="chat-compose"><button class="iconbtn" style="flex:none" onclick="toggleVoice()" title="Voice">🎙️</button><label class="iconbtn" style="flex:none">＋<input id="mediaInput" type="file" accept="image/*,video/*" hidden onchange="sendMedia(this.files[0])"></label><textarea id="messageInput" placeholder="მესიჯი..." oninput="typingNow()" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"></textarea><button class="primary" onclick="sendMessage()">${icon("send")}</button></footer></section>`}
function messageHTML(m){const mine=m.sender_id===state.session.user.id;return `<div class="bubble ${mine?"mine":""}">${m.media_url?(m.media_type?.startsWith("video")?`<video controls src="${esc(m.media_url)}"></video>`:(m.media_type?.startsWith("audio")?`<audio controls src="${esc(m.media_url)}" style="width:220px"></audio>`:`<img src="${esc(m.media_url)}">`)):""}${m.text?`<div>${esc(m.text)}</div>`:""}<small>${fmt(m.created_at)} ${m.read_at?"✓✓":""}</small></div>`}
let typingTimer=null,chatChannel=null;
function setTyping(active){if(!state.openChat||!state.session)return;const ch=chatChannel||sb.channel("chat-"+state.openChat);chatChannel=ch;ch.send({type:"broadcast",event:"typing",payload:{user_id:state.session.user.id,active:!!active}}).catch(()=>{})}
function typingNow(){state.typing=true;refreshChatTyping();setTyping(true);clearTimeout(typingTimer);typingTimer=setTimeout(()=>{state.typing=false;setTyping(false);refreshChatTyping()},1100)}
function refreshChatTyping(){const t=$("typingText");if(t)t.textContent=state.typing?`${state.chatUser?.name||"მომხმარებელი"} წერს...`:""}
function refreshChatOnly(){const box=$("chatMessages");if(box){box.innerHTML=state.messages.map(messageHTML).join("");box.scrollTop=box.scrollHeight}}
function subscribeChatChannel(){if(chatChannel)sb.removeChannel(chatChannel);if(!state.openChat)return;chatChannel=sb.channel("chat-"+state.openChat).on("broadcast",{event:"typing"},({payload})=>{if(payload?.user_id!==state.session.user.id){state.typing=!!payload?.active;refreshChatTyping();clearTimeout(typingTimer);if(state.typing)typingTimer=setTimeout(()=>{state.typing=false;refreshChatTyping()},1800)}}).subscribe()}
async function sendMessage(){const input=$("messageInput"),text=input?.value?.trim();if(!text||!state.openChat)return;input.value="";state.typing=false;setTyping(false);const optimistic={id:"local-"+crypto.randomUUID(),chat_id:state.openChat,sender_id:state.session.user.id,text,created_at:new Date().toISOString(),read_at:null};state.messages.push(optimistic);refreshChatOnly();const {data,error}=await sb.from("messages").insert({chat_id:state.openChat,sender_id:state.session.user.id,text}).select().single();if(error){state.messages=state.messages.filter(x=>x.id!==optimistic.id);refreshChatOnly();return toast(error.message)}state.messages=state.messages.map(x=>x.id===optimistic.id?data:x);refreshChatOnly()}
async function sendMedia(file){if(!file||!state.openChat)return;try{toast("იტვირთება…");const url=await uploadMedia(file,"chat");const type=file.type||"application/octet-stream";const optimistic={id:"local-"+crypto.randomUUID(),chat_id:state.openChat,sender_id:state.session.user.id,text:"",media_url:url,media_type:type,created_at:new Date().toISOString(),read_at:null};state.messages.push(optimistic);refreshChatOnly();const {data,error}=await sb.from("messages").insert({chat_id:state.openChat,sender_id:state.session.user.id,text:"",media_url:url,media_type:type}).select().single();if(error){state.messages=state.messages.filter(x=>x.id!==optimistic.id);refreshChatOnly();throw error}state.messages=state.messages.map(x=>x.id===optimistic.id?data:x);refreshChatOnly();toast("გაგზავნილია ✓")}catch(e){toast(e.message||"მედიის ატვირთვა ვერ მოხერხდა")}}
let mediaRecorder=null,voiceChunks=[];
async function toggleVoice(){if(mediaRecorder&&mediaRecorder.state==="recording"){mediaRecorder.stop();return}try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});mediaRecorder=new MediaRecorder(stream);voiceChunks=[];mediaRecorder.ondataavailable=e=>{if(e.data.size)voiceChunks.push(e.data)};mediaRecorder.onstop=async()=>{stream.getTracks().forEach(t=>t.stop());const blob=new Blob(voiceChunks,{type:mediaRecorder.mimeType||"audio/webm"});try{const file=new File([blob],`voice-${Date.now()}.webm`,{type:blob.type});await sendMedia(file)}catch(e){toast(e.message||"Voice ვერ გაიგზავნა")}mediaRecorder=null};mediaRecorder.start();toast("🎙️ ჩაწერა დაიწყო — ისევ დააჭირე გასაჩერებლად")}catch(e){toast("მიკროფონზე წვდომა ვერ მივიღე")}}
function closeChat(){if(chatChannel){sb.removeChannel(chatChannel);chatChannel=null}state.openChat=null;state.chatUser=null;state.messages=[];state.typing=false;render()}
boot();
</script>
</body>
